
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私のホームページ</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>こんにちは！</h1>

    <p>私の初めてのホームページです。</p>

    <h2>私の好きなこと</h2>
    <p>旅行・パソコン・プログラミング</p>

    <button onclick="hello()">
        クリックしてね！
    </button>
</div>

<script>
function hello() {
    alert("ホームページを見てくれてありがとう！");
}
</script>

</body>
</html>
