
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Memo</title>

    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Family Memo</h1>
    <p id="status">ログインしてください。</p>

    <!-- ログイン画面 -->
    <div id="loginArea">
        <h2>ログイン</h2>

        <input type="email" id="email"
            placeholder="メールアドレス">

        <input type="password" id="password"
            placeholder="パスワード">

        <button id="loginBtn">ログイン</button>
    </div>

    <!-- メモ画面 -->
    <div id="memoArea" class="hidden">

        <button id="logoutBtn">ログアウト</button>

        <h2>新しいメモ</h2>

        <input type="text" id="name"
            placeholder="投稿者名">

        <textarea id="message" rows="3"
            placeholder="メモを入力してください"></textarea>

        <button id="addBtn">メモを登録</button>

        <h2>登録済みメモ</h2>

        <div id="memoList"></div>

    </div>

</div>

<!-- JavaScriptファイルの読み込み -->
<script type="module" src="app.js"></script>

</body>
</html>
